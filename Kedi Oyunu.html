    <!doctype html>
    <html>
    <head>
        <meta charset="utf-8">
        <title>YILBAŞI HEDİYESİ - v53 (Default Music & Coin UI)</title>
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <style> 
            @font-face {
                font-family: 'PixelFont';
                src: url('assets/PixelatedEleganceRegular-ovyAA.ttf');
            }
            body { margin:0; background:#1b1b2f; color:#fff; font-family: 'PixelFont', sans-serif; overflow: hidden; }
        </style>
        <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    </head>
    <body>
    <script>

    class SelectionScene extends Phaser.Scene {
        constructor() { super('SelectionScene'); }
        preload() { this.load.image('background', 'assets/winter_bg.png'); }
        create() {
            if (this.textures.exists('background')) {
                this.add.image(0, 0, 'background').setOrigin(0).setDisplaySize(1920, 1080).setTint(0x222222);
            }
            this.add.text(960, 250, 'KARAKTERINI SEC', { fontFamily: 'PixelFont', fontSize: '100px', fill: '#FFD700', stroke: '#000', strokeThickness: 10 }).setOrigin(0.5);
            const isimler = ['Deniz', 'Cinar', 'Kerem', 'Elisa', 'Umut'];
            isimler.forEach((isim, index) => {
                let textBtn = this.add.text(960, 450 + (index * 110), isim, { fontFamily: 'PixelFont', fontSize: '70px', fill: '#ffffff', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5).setInteractive({ useHandCursor: true });
                textBtn.on('pointerdown', () => { this.scene.start('MainScene', { secilenIsim: isim }); });
            });
        }
    }

    class MainScene extends Phaser.Scene {
        constructor(){ super('MainScene'); }
        
        init(data) { 
            this.playerNameStr = data.secilenIsim || "Kedi"; 
            this.kediSuffix = (this.playerNameStr === 'Deniz') ? '1' : (this.playerNameStr === 'Elisa') ? '2' : (this.playerNameStr === 'Umut') ? '3' : (this.playerNameStr === 'Kerem') ? '4' : '';
        }

        preload(){
            const frameSize = { frameWidth: 80, frameHeight: 64 }; 
            this.load.spritesheet('cat_idle', `assets/cat_idle${this.kediSuffix}.png`, frameSize);
            this.load.spritesheet('cat_run', `assets/cat_run${this.kediSuffix}.png`, frameSize);
            this.load.spritesheet('cat_attack', `assets/cat_attack${this.kediSuffix}.png`, frameSize);
            this.load.spritesheet('cat_jump', `assets/cat_jump${this.kediSuffix}.png`, frameSize);
            this.load.image('snow_tile', 'assets/snow_tile_32.png'); 
            this.load.image('background', 'assets/winter_bg.png'); 
            this.load.image('rat', 'assets/rat.png'); 
            this.load.spritesheet('coin', 'assets/coin.png', { frameWidth: 16, frameHeight: 16 }); 
            this.load.audio('coin_collect', 'assets/coin_collect.mp3');
            this.load.audio('music_default', 'assets/music_default.mp3'); // Sabit müzik dosyası
            this.load.image('heart', 'assets/heart.png'); 
            this.load.image('speed_box_png', 'assets/speed_box.png'); 
            this.load.image('message_box_png', 'assets/message_box.png'); 
            this.load.image('link_box_png', 'assets/link_box.png'); 
        }
        
        create(){
            const WORLD_WIDTH = 5000;
            const TILE_SIZE = 32;
            this.physics.world.setBounds(0, 0, WORLD_WIDTH, 1080);
            
            // MÜZİK BAŞLAT (loop: true)
            this.sound.stopAll();
            this.bgMusic = this.sound.add('music_default', { volume: 0.4, loop: true });
            this.bgMusic.play();

            for(let i=0; i < (WORLD_WIDTH/1920)+1; i++) {
                this.add.image(i*1920, 0, 'background').setOrigin(0).setTint(0x444444);
            }

            this.platforms = this.physics.add.staticGroup();

            // ANA ZEMİN
            for(let x=0; x < WORLD_WIDTH/TILE_SIZE; x++) {
                this.platforms.create(x * TILE_SIZE, 576, 'snow_tile').setOrigin(0).refreshBody(); 
            }

            // ALÇAK VE UZUN PLATFORMLAR
            for(let offset = 500; offset < WORLD_WIDTH; offset += 1000) {
                for(let i=0; i<12; i++) this.platforms.create(offset + (i * TILE_SIZE), 480, 'snow_tile').setOrigin(0).refreshBody();
                for(let i=0; i<10; i++) this.platforms.create(offset + 300 + (i * TILE_SIZE), 380, 'snow_tile').setOrigin(0).refreshBody();
                for(let i=0; i<12; i++) this.platforms.create(offset + 600 + (i * TILE_SIZE), 280, 'snow_tile').setOrigin(0).refreshBody();
            }

            this.platformPositions = [];
            this.platforms.getChildren().forEach(p => {
                if(p.y < 576) this.platformPositions.push({ x: p.x + TILE_SIZE / 2, y: p.y - 28 });
            });
            
            this.player = this.physics.add.sprite(150, 500, 'cat_idle'); 
            this.player.setOrigin(0.5, 1); 
            this.player.body.setSize(20, 56).setOffset(20, -8); 
            this.player.speed = 140;

            this.nameTag = this.add.text(this.player.x, this.player.y - 110, this.playerNameStr, { fontFamily: 'PixelFont', fontSize: '24px', fill: '#ffffff', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5);

            this.playerAttackHitbox = this.physics.add.sprite(-200, -200, null).setVisible(false);
            this.playerAttackHitbox.body.setAllowGravity(false).setSize(50, 50);

            this.createAnimations();

            this.ratGroup = this.physics.add.group({ allowGravity: false });
            for(let i=0; i<15; i++) this.spawnRat();

            this.coins = this.physics.add.group();
            for(let i=0; i<30; i++) this.spawnNewCoin(WORLD_WIDTH);
            
            this.physics.add.collider(this.player, this.platforms);
            this.physics.add.overlap(this.player, this.coins, this.collectCoin, null, this);
            this.physics.add.overlap(this.player, this.ratGroup, this.ratDamagePlayer, null, this);
            this.physics.add.overlap(this.playerAttackHitbox, this.ratGroup, this.onRatHit, () => this.player.isAttacking, this);

            this.cameras.main.startFollow(this.player, true, 0.08, 0.08);
            this.cameras.main.setBounds(0, 0, WORLD_WIDTH, 1080);
            this.cameras.main.setZoom(1.5); 

            this.cursors = this.input.keyboard.createCursorKeys();
            this.keyX = this.input.keyboard.addKey('X');
            this.keyZ = this.input.keyboard.addKey('Z');
            
            // --- UI (SAYAÇ VE COIN İKONU) ---
            this.score = 0;
            this.coinIcon = this.add.sprite(1920 - 400, 235, 'coin').setScrollFactor(0).setScale(2);
            // --- HIGH SCORE ---
    this.highScoreKey = `highscore_${this.playerNameStr}`;
    this.highScore = parseInt(localStorage.getItem(this.highScoreKey)) || 0;

    this.highScoreText = this.add.text(
        1920 - 400,
        260,
        `HS: ${this.highScore}`,
        { fontFamily: 'PixelFont', fontSize:'28px', fill:'#00FFAA' }
    ).setScrollFactor(0);

            this.coinIcon.anims.play('coin_spin');
            this.scoreText = this.add.text(1920 - 360, 220, '0', { fontFamily: 'PixelFont', fontSize:'32px', fill:'#FFD700'}).setScrollFactor(0);

            this.health = 3;
            this.hearts = [];
            for (let i = 0; i < 3; i++) {
                this.hearts.push(this.add.image(1920 - 20 - (i * 35), 20, 'heart').setScrollFactor(0).setOrigin(1, 0).setScale(2));
            }

            this.specialMessageText = this.add.text(960, 540, '', { fontFamily: 'PixelFont', fontSize: '28px', fill: '#FF00FF', backgroundColor: '#000000cc', padding: 20, wordWrap: { width: 800 }, align: 'center' }).setScrollFactor(0).setOrigin(0.5).setVisible(false).setDepth(1000);
            
            const ITEM_X = (1920 - 700) / 2;
            this.add.image(ITEM_X, 810, 'speed_box_png').setOrigin(0).setScrollFactor(0).setInteractive().on('pointerdown', this.buySpeedBoost, this);
            this.add.image(ITEM_X + 250, 810, 'message_box_png').setOrigin(0).setScrollFactor(0).setInteractive().on('pointerdown', this.buySpecialMessage, this);
            this.add.image(ITEM_X + 500, 810, 'link_box_png').setOrigin(0).setScrollFactor(0).setInteractive().on('pointerdown', this.buySurpriseLink, this);
        }

        spawnNewCoin(w = 5000) {
            let coin = this.coins.create(Phaser.Math.Between(100, w-100), Phaser.Math.Between(100, 500), 'coin').setScale(1.5);
            coin.body.setAllowGravity(false);
            coin.anims.play('coin_spin', true);
        }

        collectCoin(p, c){
            c.destroy();
            this.score++;
            this.scoreText.setText(this.score);
            this.sound.play('coin_collect', { volume: 0.3 });
            this.time.delayedCall(1000, () => this.spawnNewCoin());
        }

        spawnRat() {
            if(this.platformPositions.length === 0) return;
            const pos = Phaser.Utils.Array.GetRandom(this.platformPositions);
            const rat = this.ratGroup.create(pos.x, pos.y, 'rat');
            rat.body.setSize(40, 20).setOffset(20, 48);
            rat.patrol = { left: pos.x - 120, right: pos.x + 120, dir: 1, speed: 80 };
        }

        onRatHit(h, r) { r.destroy(); this.score += 10; this.scoreText.setText(this.score); this.time.delayedCall(3000, () => this.spawnRat()); }

        ratDamagePlayer() { 
            if(this.invincible) return;
            this.health--;
            if(this.hearts[this.health]) this.hearts[this.health].setVisible(false);
            if(this.health <= 0) this.scene.restart();
            else { this.invincible = true; this.player.setAlpha(0.5); this.time.delayedCall(1500, () => { this.invincible = false; this.player.setAlpha(1); }); }
        }

        buySpeedBoost() { if(this.score >= 10) { this.score -= 10; this.scoreText.setText(this.score); this.player.speed = 280; this.time.delayedCall(10000, () => this.player.speed = 140); } }
        
        buySpecialMessage() { 
            if(this.score >= 50) { 
                this.score -= 50; this.scoreText.setText(this.score);
                let m = "Harika birisin!";
                if(this.playerNameStr === 'Deniz') m = "bu yıl tanıdıgım en iyi insanlardan birisin, gelecek yıl umarım her sey istedigin gibi gider yeni yılın kutlu olsun <3";
                else if(this.playerNameStr === 'Umut') m = "king en goat adamlardan birisin, umarım gelecek yıl istedigin hersey gerceklesir, yeni yılın kutlu olsun <3";
                else if(this.playerNameStr === 'Cinar') m = "kendime niye mesaj yazam aq";
                else if(this.playerNameStr === 'Kerem') m = "kerem adamin dibisin kardesim, umarım gelecek yıl istedigin her sey gerceklestir, izmire gelde akalim, yeni yılın kutlu olsun king <3";
                else if(this.playerNameStr === 'Elisa') m = "bacim cok iyi birisin umarim gelecek yıl istedigin yeri tutturursun, yeni yılın kutlu olsun <3";
                this.specialMessageText.setText(m).setVisible(true);
                this.time.delayedCall(7000, () => this.specialMessageText.setVisible(false));
            }
        }

        buySurpriseLink() {
        if (this.score >= 30) {
            this.score -= 30;
            this.scoreText.setText(this.score);

            const specialLinks = {
                Deniz: "https://youtu.be/oNNs-HRu-vs?si=hEMG0JSE_G8YW7Fp",
                Umut: "https://youtu.be/TzNqtnw0NoI?si=p2SGj8h0sOINoqD6",
                Kerem: "https://youtu.be/6HtkKvS4mH8?si=choB-AmSk5x6KwRO",
                Elisa: "https://youtu.be/dSepdKnl3pg?si=8tTn_Dt0ZnkSsrIk",
                Cinar: "https://link-cinar.com"
            };

            const linkToOpen =
                specialLinks[this.playerNameStr] ||
                "https://www.youtube.com/watch?v=dQw4w9WgXcQ";

            window.open(linkToOpen, "_blank");
        }
    }


        createAnimations(){
            this.anims.create({ key: 'idle', frames: this.anims.generateFrameNumbers('cat_idle', { start:0, end:3 }), frameRate: 6, repeat: -1 });
            this.anims.create({ key: 'run', frames: this.anims.generateFrameNumbers('cat_run', { start:0, end:5 }), frameRate: 10, repeat: -1 });
            this.anims.create({ key: 'attack', frames: this.anims.generateFrameNumbers('cat_attack', { start:0, end:4 }), frameRate: 12, repeat: 0 });
            this.anims.create({ key: 'coin_spin', frames: this.anims.generateFrameNumbers('coin', { start:0, end:11 }), frameRate: 12, repeat: -1 });
        }

        update(){
            this.physics.world.wrap(this.player, 0); 
            this.nameTag.setPosition(this.player.x, this.player.y - 110);
            
            if(this.keyX.isDown && !this.player.isAttacking){
                this.player.isAttacking = true;
                this.player.anims.play('attack', true);
                this.playerAttackHitbox.body.reset(this.player.x + (this.player.flipX ? 20 : -60), this.player.y - 20);
                this.time.delayedCall(500, () => this.player.isAttacking = false);
            }

            if(!this.player.isAttacking){
                if(this.cursors.left.isDown){ this.player.setVelocityX(-this.player.speed); this.player.flipX = false; this.player.anims.play('run', true); }
                else if(this.cursors.right.isDown){ this.player.setVelocityX(this.player.speed); this.player.flipX = true; this.player.anims.play('run', true); }
                else { this.player.setVelocityX(0); this.player.anims.play('idle', true); }
            }

            if((Phaser.Input.Keyboard.JustDown(this.cursors.up) || Phaser.Input.Keyboard.JustDown(this.keyZ)) && this.player.body.onFloor()){
                this.player.setVelocityY(-450);
            }

            this.ratGroup.children.iterate(rat => {
                if(!rat) return;
                if(rat.x <= rat.patrol.left) rat.patrol.dir = 1;
                else if(rat.x >= rat.patrol.right) rat.patrol.dir = -1;
                rat.setVelocityX(rat.patrol.dir * rat.patrol.speed);
                rat.flipX = rat.patrol.dir === 1;
            });
        }
    }

    const config = { type: Phaser.AUTO, width: 1920, height: 1080, scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }, physics:{ default:'arcade', arcade:{ gravity:{y:850} } }, scene:[SelectionScene, MainScene] };
    new Phaser.Game(config);
    </script>
    </body>
    </html>
